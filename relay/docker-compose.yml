# Runs the Tasklace relay behind Caddy, which gets and renews the HTTPS certificate of the domain on its own.
# From this folder, with a domain name that points at this server and ports 80 and 443 open:
#   RELAY_DOMAIN=relay.example.org docker compose up -d
# The relay itself is reached only by Caddy, on a network of their own; it publishes no port.

name: tasklace-relay

services:
  relay:
    build:
      context: ..
      dockerfile: relay/Dockerfile
    image: tasklace-relay:local
    restart: unless-stopped
    environment:
      RELAY_TRUST_PROXY: '1'
    volumes:
      - relay-data:/data
    networks:
      - inside
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  caddy:
    image: caddy:2.11.7-alpine@sha256:eb4d35b7452d1ab6171fbdbe8d9275b2301dad6dad92115d91e19fb9b24d510f
    restart: unless-stopped
    environment:
      RELAY_DOMAIN: ${RELAY_DOMAIN:?Set RELAY_DOMAIN to the domain name of this server}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    tmpfs:
      - /tmp
    networks:
      - inside
      - outside
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    depends_on:
      relay:
        condition: service_healthy

networks:
  inside:
    internal: true
  outside: {}

volumes:
  relay-data: {}
  caddy-data: {}
  caddy-config: {}
