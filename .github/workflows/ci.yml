name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-test:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm test

  time-zones:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        time-zone: [America/Los_Angeles, Pacific/Kiritimati]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Run the unit tests far from UTC (${{ matrix.time-zone }})
        run: npx vitest run --coverage.enabled=false --reporter=verbose
        env:
          TZ: ${{ matrix.time-zone }}

  end-to-end:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Run the application tests on a virtual screen (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum npm run test:e2e
      - name: Run the application tests (Windows)
        if: runner.os == 'Windows'
        run: npm run test:e2e
      - name: Keep the traces of failed application tests
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: application-test-results-${{ runner.os }}
          path: test-results/
          retention-days: 7

  growth-and-benchmarks:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Check the growth of key operations (blocking)
        run: npm run bench:growth -- --silent=false
      - name: Report the millisecond targets (indicative)
        run: npm run bench -- --silent=false
        continue-on-error: true

  relay-image:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check that no package of the relay has a known flaw
        working-directory: relay
        run: npm audit --omit=dev --audit-level=low
      - name: Build the image of the relay
        run: docker build --file relay/Dockerfile --tag tasklace-relay:ci .
      - name: Run the relay with the restrictions of the compose file
        run: >
          docker run --detach --name relay --read-only --cap-drop ALL
          --security-opt no-new-privileges:true --publish 127.0.0.1:8080:8080
          tasklace-relay:ci
      - name: Wait until the relay is healthy
        run: |
          for attempt in $(seq 30); do
            status=$(docker inspect --format '{{.State.Health.Status}}' relay)
            if [ "$status" = healthy ]; then exit 0; fi
            sleep 2
          done
          docker logs relay
          exit 1
      - name: Check that the relay answers 426 to a web page, runs without rights and has no npm
        run: |
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8080/)" = 426
          test "$(docker exec relay id -u)" != 0
          if docker exec relay sh -c 'command -v npm || command -v npx || command -v yarn'; then exit 1; fi
          test -z "$(docker exec relay find /app -name '*.test.ts')"
      - name: Check the compose file
        run: RELAY_DOMAIN=relay.example.org docker compose --file relay/docker-compose.yml config --quiet
      - name: Show what the relay wrote when a check failed
        if: failure()
        run: docker logs relay

  linux-package:
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build the package
        run: npm run dist:linux
      - name: Check that the other systems it is made for find all it depends on
        run: |
          for image in debian:12 debian:13 ubuntu:22.04 ubuntu:26.04; do
            docker run --rm --volume "$PWD/dist:/package:ro" "$image" \
              sh -c 'apt-get update -qq && apt-get install --simulate --yes /package/Tasklace-*-amd64.deb'
          done
      - name: Install the package as a person would
        run: |
          sudo apt-get update
          sudo apt-get install --yes ./dist/Tasklace-*-amd64.deb
      - name: Test the installed application, its sandbox on
        run: xvfb-run --auto-servernum npm run test:packaged
        env:
          TASKLACE_PACKAGED_APP: /opt/Tasklace/tasklace
          TASKLACE_INSTALLED_PACKAGE: '1'
      - name: Uninstall the package and check that no file of it stays
        run: |
          test -e /etc/apparmor.d/tasklace
          test -e /usr/bin/tasklace
          dpkg --listfiles tasklace > installed-files
          grep --quiet '^/usr/share/applications/tasklace.desktop$' installed-files
          sudo apt-get remove --yes tasklace
          while read -r path; do
            if [ -f "$path" ]; then
              echo "$path stayed"
              exit 1
            fi
          done < installed-files
          test ! -e /opt/Tasklace
          test ! -e /etc/apparmor.d/tasklace
          test ! -e /usr/bin/tasklace
          ! gio mime x-scheme-handler/tasklace | grep --quiet tasklace.desktop
      - name: Keep the package for a week
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tasklace-linux
          path: dist/*.deb
          if-no-files-found: error
          retention-days: 7
      - name: Keep the traces of failed tests of the installed application
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-package-test-results
          path: test-results/
          retention-days: 7

  windows-package:
    timeout-minutes: 30
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build the portable executable and the installer, unsigned
        run: npm run dist
      - name: Test the built application and the installer
        run: npm run test:packaged
        env:
          TASKLACE_PACKAGED_APP: ${{ github.workspace }}/dist/win-unpacked/Tasklace.exe
          TASKLACE_REQUIRE_WINDOWS_TESTS: '1'
      - name: Keep the unsigned executables for a week
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tasklace-windows-unsigned
          path: |
            dist/*.exe
          if-no-files-found: error
          retention-days: 7
      - name: Keep the traces of failed tests of the built application
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packaged-test-results
          path: test-results/
          retention-days: 7
