name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-test:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm test

  time-zones:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        time-zone: [America/Los_Angeles, Pacific/Kiritimati]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Run the unit tests far from UTC (${{ matrix.time-zone }})
        run: npx vitest run --coverage.enabled=false --reporter=verbose
        env:
          TZ: ${{ matrix.time-zone }}

  end-to-end:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Run the application tests on a virtual screen (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum npm run test:e2e
      - name: Run the application tests (Windows)
        if: runner.os == 'Windows'
        run: npm run test:e2e
      - name: Keep the traces of failed application tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: application-test-results-${{ runner.os }}
          path: test-results/
          retention-days: 7

  growth-and-benchmarks:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Check the growth of key operations (blocking)
        run: npm run bench:growth -- --silent=false
      - name: Report the millisecond targets (indicative)
        run: npm run bench -- --silent=false
        continue-on-error: true
