name: Release

# Builds a version tag pushed from main on Windows, tests what it built, and prepares a draft release with the
# executables and their fingerprints, which a maintainer reads and publishes by hand. The job that builds never holds
# the right to write to the repository; only the last job, which runs no code of the project, does.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    timeout-minutes: 40
    runs-on: windows-latest
    outputs:
      prerelease: ${{ steps.files.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check that the tag is on main
        shell: bash
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm ci
      - name: Build the portable executable and the installer, unsigned
        run: npm run dist
      - name: Test the built application and the installer
        run: npm run test:packaged
        env:
          TASKLACE_PACKAGED_APP: ${{ github.workspace }}/dist/win-unpacked/Tasklace.exe
          TASKLACE_REQUIRE_WINDOWS_TESTS: '1'
      - name: Write the notes and the fingerprints of the release
        id: files
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: node scripts/write-release-files.ts "$TAG"
      - name: Keep the files of the release
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: |
            dist/Tasklace-*-portable.exe
            dist/Tasklace-*-setup.exe
            dist/SHA256SUMS.txt
            dist/release-notes.md
          if-no-files-found: error
          retention-days: 7

  draft:
    needs: build
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release
      - name: Prepare the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          flags=(--draft --verify-tag --title "Tasklace ${TAG#v}" --notes-file release/release-notes.md)
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" "${flags[@]}" \
            release/Tasklace-*-portable.exe release/Tasklace-*-setup.exe release/SHA256SUMS.txt
