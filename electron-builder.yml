# How electron-builder packs Tasklace: for Linux a .deb package, which keeps the sandbox of Chromium on Ubuntu 24 and
# later through its AppArmor profile, and for Windows a portable executable and an installer for the current user, or
# for everyone when an administrator chooses so.
# Everything is built by continuous integration only, the Windows executables on Windows; nothing is signed.
appId: io.github.gfayrr.tasklace
productName: Tasklace
copyright: © Fayr
directories:
  buildResources: build
  output: dist
files:
  - out/**
  - resources/**
  - package.json
asar: true
electronLanguages:
  - en-US
extraFiles:
  - from: LICENSE
    to: LICENSE.txt
  - from: src/renderer/public/fonts/OFL.txt
    to: licenses/Jost-OFL.txt
  - from: out/licenses/THIRD-PARTY-NOTICES.txt
    to: licenses/THIRD-PARTY-NOTICES.txt
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  loadBrowserProcessSpecificV8Snapshot: false
  grantFileProtocolExtraPrivileges: false
win:
  icon: build/icons/tasklace.ico
  extraResources:
    - from: build/icons/tasklace-file.ico
      to: tasklace-file.ico
  target:
    - portable
    - nsis
portable:
  artifactName: Tasklace-${version}-portable.${ext}
nsis:
  artifactName: Tasklace-${version}-setup.${ext}
  oneClick: false
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: true
  createStartMenuShortcut: true
  createDesktopShortcut: false
  deleteAppDataOnUninstall: false
  include: build/installer.nsh
  installerIcon: build/icons/tasklace.ico
  uninstallerIcon: build/icons/tasklace.ico
linux:
  icon: build/icons/linux
  category: Office
  synopsis: Create, share and export Gantt charts
  description: A simple desktop application to create, edit, share and export Gantt charts.
  maintainer: Fayr <199396723+GFayrr@users.noreply.github.com>
  vendor: Fayr
  executableName: tasklace
  syncDesktopName: true
  executableArgs:
    - '--'
    - '%U'
  mimeTypes:
    - x-scheme-handler/tasklace
  fileAssociations:
    - ext: tasklace
      name: Tasklace project
      mimeType: application/x-tasklace
  target:
    - deb
deb:
  artifactName: Tasklace-${version}-amd64.${ext}
  depends:
    - libasound2
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libuuid1
    - libsecret-1-0
    - desktop-file-utils
publish: null
